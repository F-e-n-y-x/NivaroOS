<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="monitorGrad" x1="0" y1="4" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="52" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Monitor Frame Shadow & Base -->
  <rect x="4" y="6" width="56" height="38" rx="7" fill="#0f172a" />
  <rect x="5" y="7" width="54" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Screen Content -->
  <rect x="8" y="10" width="48" height="30" rx="3" fill="url(#screenBg)"/>
  
  <!-- Mini Desktop UI on screen -->
  <!-- Topbar on mini screen -->
  <rect x="8" y="10" width="48" height="5" fill="#18181b"/>
  <circle cx="11" cy="12.5" r="1" fill="#ef4444"/>
  <circle cx="14" cy="12.5" r="1" fill="#f59e0b"/>
  <circle cx="17" cy="12.5" r="1" fill="#10b981"/>
  
  <!-- Mini Windows / Desktop icons on screen -->
  <rect x="11" y="18" width="22" height="15" rx="2" fill="#2563eb" fill-opacity="0.85"/>
  <rect x="11" y="18" width="22" height="4" rx="1" fill="#1d4ed8"/>
  <line x1="14" y1="25" x2="28" y2="25" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="14" y1="28" x2="23" y2="28" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round"/>
  
  <rect x="27" y="22" width="24" height="14" rx="2" fill="#1e1e24" stroke="#3b82f6" stroke-width="0.8"/>
  <circle cx="32" cy="27" r="1.5" fill="#38bdf8"/>
  <circle cx="38" cy="27" r="1.5" fill="#a78bfa"/>
  <circle cx="44" cy="27" r="1.5" fill="#34d399"/>
  <line x1="31" y1="31" x2="47" y2="31" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>

  <!-- Stand Neck -->
  <path d="M28 44H36L38 53H26L28 44Z" fill="url(#baseGrad)"/>

  <!-- Stand Foot -->
  <rect x="20" y="53" width="24" height="4" rx="2" fill="#94a3b8"/>
  <rect x="20" y="55" width="24" height="2" rx="1" fill="#64748b"/>
</svg>
