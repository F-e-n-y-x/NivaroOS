<!DOCTYPE html>
<html lang="">

<head>
	<meta charset="utf-8">
	<meta content="IE=edge" http-equiv="X-UA-Compatible">
	<meta content="width=device-width,initial-scale=1" name="viewport">
	<meta content="noindex" name="robots">
	<link href="<%= BASE_URL %>img/icon/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
	<link href="<%= BASE_URL %>site.webmanifest" rel="manifest">
	<meta content="#da532c" name="msapplication-TileColor">
	<meta content="#ffffff" name="theme-color">
	<script>
		(function() {
			try {
				var mode = localStorage.getItem('uiThemeMode') || 'auto';
				var isDark = mode === 'dark' || (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
				var effective = isDark ? 'dark' : 'light';
				var root = document.documentElement;
				root.setAttribute('data-theme', effective);
				root.setAttribute('data-theme-mode', mode);
				root.classList.toggle('is-dark', isDark);
				root.classList.toggle('is-light', !isDark);
				var metaTheme = document.querySelector('meta[name="theme-color"]');
				if (metaTheme) {
					metaTheme.setAttribute('content', isDark ? '#000000' : '#ffffff');
				}
			} catch(e) {}
		})();
	</script>
	<link href="<%= BASE_URL %>favicon.ico" rel="shortcut icon" type="image/x-icon">
	<link href="<%= BASE_URL %>favicon.ico" mask="" rel="icon" sizes="any">
	<link href="<%= BASE_URL %>css/custom.css" rel="stylesheet">
	<link href="<%= BASE_URL %>css/cursors.css" rel="stylesheet">
	<title>
		NivaroOS
	</title>
</head>

<body>
	<noscript>
		<strong>We're sorry but NivaroOS doesn't work properly without JavaScript enabled.
			Please enable it to continue.</strong>
	</noscript>
	<div id="app"></div>
	<!-- built files will be auto injected -->
	<script type="text/javascript" src="<%= BASE_URL %>js/custom.js"></script>
</body>

</html>
