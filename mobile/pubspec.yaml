name: nivaroos_mobile
description: Native Android/iOS companion app for NivaroOS - your personal cloud, in your pocket.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  multicast_dns: ^0.3.2+6
  intl: ^0.19.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  file_picker: ^8.1.2
  package_info_plus: ^8.0.2
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.1
  flutter_svg: ^2.1.0
  permission_handler: ^11.3.1
  video_player: ^2.9.5
  chewie: ^1.10.0
  flutter_pdfview: ^1.4.4
  flutter_markdown: ^0.7.7+1
  device_info_plus: ^11.3.0
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/app/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#EEF6FF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
