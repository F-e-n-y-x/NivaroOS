name: nivaroos_mobile
description: Native Android/iOS companion app for NivaroOS - your personal cloud, in your pocket.
publish_to: 'none'
version: 1.3.0+7

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  http: ^1.6.0
  # Held on 10.x for one release: 10 migrates the EncryptedSharedPreferences
  # data that 9.x wrote, and 11 removed that migration, so a user jumping
  # straight from a 9.x build to 11 would lose every stored token (plan M-38).
  flutter_secure_storage: ^10.3.4
  multicast_dns: ^0.3.3+1
  intl: ^0.20.3
  # The current time behind a seam (clock.now()), so tests and screenshots
  # can freeze it.
  clock: ^1.1.2
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  file_picker: ^13.1.0
  package_info_plus: ^10.2.1
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  permission_handler: ^13.0.2
  video_player: ^2.14.0
  chewie: ^1.17.2
  flutter_pdfview: ^1.4.5
  flutter_markdown_plus: ^1.0.12
  device_info_plus: ^13.2.0
  ffi: ^2.2.0
  xterm: ^4.0.0
  flutter_background_service: ^5.1.0
  battery_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/app/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#EEF6FF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
