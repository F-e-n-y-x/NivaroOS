name: nivaroos_mobile
description: Native Android/iOS companion app for NivaroOS - your personal cloud, in your pocket.
publish_to: 'none'
version: 1.4.1+11

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  http: ^1.6.0
  # Held on 10.x for one release: 10 migrates the EncryptedSharedPreferences
  # data that 9.x wrote, and 11 removed that migration, so a user jumping
  # straight from a 9.x build to 11 would lose every stored token (plan M-38).
  flutter_secure_storage: ^10.3.4
  multicast_dns: ^0.3.3+1
  intl: ^0.20.3
  # The current time behind a seam (clock.now()), so tests and screenshots
  # can freeze it.
  clock: ^1.1.2
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  file_picker: ^13.1.0
  package_info_plus: ^10.2.1
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  permission_handler: ^13.0.2
  video_player: ^2.14.0
  chewie: ^1.17.2
  flutter_pdfview: ^1.4.5
  flutter_markdown_plus: ^1.0.12
  device_info_plus: ^13.2.0
  ffi: ^2.2.0
  xterm: ^4.0.0
  flutter_background_service: ^5.1.0
  battery_plus: ^7.1.1
  # Reads the compose file for Edit app (the server sends YAML).
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/app/
    - assets/fonts/OFL-geist.txt
    - assets/fonts/OFL-googlesansflex.txt
    - assets/fonts/OFL-ibmplexsans.txt
  # Design system v3 typefaces (docs/specs/2026-09-25-mobile-design-system.md,
  # 'Design system v3 - directions'). Static Latin cuts from Google Fonts
  # (via Fontsource), SIL OFL 1.1; licences in assets/fonts/OFL-*.txt.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-300.ttf
          weight: 300
        - asset: assets/fonts/Geist-400.ttf
          weight: 400
        - asset: assets/fonts/Geist-500.ttf
          weight: 500
        - asset: assets/fonts/Geist-600.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-400.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-500.ttf
          weight: 500
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-300.ttf
          weight: 300
        - asset: assets/fonts/GoogleSansFlex-400.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-500.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlex-600.ttf
          weight: 600
        - asset: assets/fonts/GoogleSansFlex-700.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-300.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSans-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-600.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#EEF6FF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
