# Installed by NivaroOS as a drop-in for every nivaroos*.service.
# Restart= itself stays whatever the unit sets (always / on-failure); this
# only makes restarts sane: a short pause between attempts, and a start
# limit wide enough that a slow crash loop doesn't leave the unit dead for
# good - nivaroos-watchdog.timer picks up whatever does end up "failed"
# (and rolls back a fresh binary that keeps failing).
[Unit]
StartLimitIntervalSec=10min
StartLimitBurst=20

[Service]
RestartSec=3s
# When the machine runs out of memory, the kernel should pick a build, a
# browser tab or a runaway app before the services that keep the box
# reachable (seen on 2026-09-29: Gradle, Chrome and Flutter builds filled
# 31 GB). Not -1000: a NivaroOS service that leaks must still be killable.
OOMScoreAdjust=-500
