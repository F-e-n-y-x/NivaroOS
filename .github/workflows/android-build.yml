name: Build Android app

# Builds the NivaroOS native Android app (mobile/, a Flutter project) into
# an installable debug APK on every push that touches it, and publishes it
# as a downloadable workflow artifact - the Android/Flutter toolchain is
# heavier than something worth requiring of every contributor's own
# machine just to get a build.
on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: nivaroos-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
