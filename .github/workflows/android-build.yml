name: Android app

# Checks every change to the NivaroOS Android app (mobile/, Flutter):
# analyze, tests, and a stable (release-mode) APK build, kept as a
# workflow artifact for 30 days.
#
# The official signing key never leaves the build server (owner decision,
# 2026-10-08), so this APK is signed with a throwaway key: it proves the
# release build works but can't update an installed NivaroOS app. The
# signed APK people install is the one on GitHub Releases.
on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Screenshot goldens are left out: their pixels depend on the
      # machine that rendered them, so they're checked on the build server.
      - name: Test
        run: flutter test $(find test -name '*_test.dart' -not -path 'test/screenshots/*' | sort)

      - name: Build stable APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nivaroos-android-check-build
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
